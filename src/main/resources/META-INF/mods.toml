modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 目标主 mod：TACZ（永恒枪械工坊：零）
[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=true
    versionRange="[1.1.8,1.2)"
    ordering="AFTER"
    side="BOTH"

# 可选联动：精妙背包（未安装时相关内容整体不注册）
[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    mandatory=false
    versionRange="[3.26,)"
    ordering="AFTER"
    side="BOTH"

# [M10] curios 可选依赖：供弹升级的饰品槽扫描（curios 缺席时分支自动跳过）
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5.0,)"
    ordering="AFTER"
    side="BOTH"